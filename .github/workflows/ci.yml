name: 🚀 CI — بررسی کیفیت و اعتبارسنجی

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ============================================================
  # ۱. اعتبارسنجی HTML و بررسی استانداردها
  # ============================================================
  validate-html:
    name: 📝 اعتبارسنجی HTML
    runs-on: ubuntu-latest
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 راه‌اندازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 نصب html5validator
        run: pip install html5validator

      - name: 🔍 اعتبارسنجی HTML
        run: html5validator --root . --files index.html

  # ============================================================
  # ۲. بررسی فرمت و سبک کد با Prettier
  # ============================================================
  check-format:
    name: 💅 بررسی فرمت کد (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: ⚙️ راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 نصب Prettier
        run: |
          npm init -y
          npm install --save-dev prettier

      - name: 🔍 بررسی فرمت CSS
        run: npx prettier --check "**/*.css"
        continue-on-error: true

      - name: 🔍 بررسی فرمت JavaScript
        run: npx prettier --check "**/*.js"
        continue-on-error: true

      - name: 🔍 بررسی فرمت HTML
        run: npx prettier --check "**/*.html"
        continue-on-error: true

  # ============================================================
  # ۳. بررسی لینک‌های شکسته
  # ============================================================
  check-links:
    name: 🔗 بررسی لینک‌های شکسته
    runs-on: ubuntu-latest
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🔍 بررسی لینک‌ها با Lychee
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          args: --verbose --no-progress --exclude "https://pershiaa.qd.je.*" --exclude "https://masoudshafizadeh028-dev.github.io.*" './**/*.html' './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # ۴. بررسی دسترس‌پذیری و عملکرد با Lighthouse
  # ============================================================
  lighthouse:
    name: ⚡ بررسی عملکرد و دسترس‌پذیری (Lighthouse)
    runs-on: ubuntu-latest
    needs: [validate-html]
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: ⚙️ راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🌐 اجرای سرور محلی
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: 🚀 اجرای Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080/index.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json

  # ============================================================
  # ۵. بررسی امنیتی با CodeQL
  # ============================================================
  codeql:
    name: 🔐 بررسی امنیتی کد (CodeQL)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🔍 مقداردهی اولیه CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: 🔬 اجرای تحلیل CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ============================================================
  # ۶. خلاصه وضعیت
  # ============================================================
  summary:
    name: 📊 خلاصه وضعیت CI
    runs-on: ubuntu-latest
    needs: [validate-html, check-format, check-links, lighthouse]
    if: always()
    steps:
      - name: ✅ گزارش موفقیت
        if: needs.validate-html.result == 'success' && needs.check-links.result == 'success'
        run: |
          echo "✅ تمام بررسی‌های اصلی با موفقیت گذرانده شدند!"
          echo "پروژه آماده بازبینی و ادغام است."

      - name: ⚠️ گزارش هشدار
        if: needs.validate-html.result == 'success' && (needs.check-format.result != 'success' || needs.lighthouse.result != 'success')
        run: |
          echo "⚠️ بررسی‌های اصلی موفق بودند اما برخی بررسی‌های جانبی هشدار دارند."
          echo "لطفاً جزئیات کارهای بالا را بررسی کنید."

      - name: ❌ گزارش خطا
        if: needs.validate-html.result != 'success' || needs.check-links.result != 'success'
        run: |
          echo "❌ برخی بررسی‌های اصلی شکست خورده‌اند."
          echo "لطفاً مشکلات را رفع کنید و دوباره تلاش کنید."
          return 1 2>/dev/null || true
