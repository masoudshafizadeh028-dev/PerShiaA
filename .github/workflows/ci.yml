name: 🚀 CI — بررسی کیفیت و اعتبارسنجی

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ============================================================
  # ۱. اعتبارسنجی HTML و بررسی استانداردها
  # ============================================================
  validate-html:
    name: 📝 اعتبارسنجی HTML
    runs-on: ubuntu-latest
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 راه‌اندازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 نصب html5validator
        run: pip install html5validator

      - name: 🔍 اعتبارسنجی HTML
        run: html5validator --root . --files index.html

  # ============================================================
  # ۲. تست تعاملات و بررسی فرمت (شکست هر مرحله CI را ناموفق می‌کند)
  # ============================================================
  test-and-format:
    name: 🧪 تست رفتار و فرمت
    runs-on: ubuntu-latest
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: ⚙️ راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 نصب وابستگی‌های قفل‌شده
        run: npm ci

      - name: 🔍 بررسی فرمت
        run: npm run format:check

      - name: 🧪 اجرای آزمون‌ها
        run: npm test

  # ============================================================
  # ۳. بررسی لینک‌های شکسته
  # ============================================================
  check-links:
    name: 🔗 بررسی لینک‌های شکسته
    runs-on: ubuntu-latest
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🔍 بررسی لینک‌ها با Lychee
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          args: --verbose --no-progress --exclude "https://pershiaa.qd.je.*" --exclude "https://masoudshafizadeh028-dev.github.io.*" './**/*.html' './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # ۴. بررسی دسترس‌پذیری و عملکرد با Lighthouse
  # ============================================================
  lighthouse:
    name: ⚡ بررسی عملکرد و دسترس‌پذیری (Lighthouse)
    runs-on: ubuntu-latest
    needs: [validate-html]
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: ⚙️ راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🌐 اجرای سرور محلی
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: 🚀 اجرای Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080/index.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
